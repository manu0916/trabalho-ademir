# Ative com SPRING_PROFILES_ACTIVE=supabase e preencha as variáveis no ambiente.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
app.cookies.cross-site=true
# Required production identity and store destination. No packaged fallback is allowed.
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password-hash=${APP_ADMIN_PASSWORD_HASH}
app.store.whatsapp-number=${APP_STORE_WHATSAPP_NUMBER}
# Este perfil é para publicação atrás de um proxy TLS confiável.
app.security.enforce-https=true
# O proxy deve remover cabeçalhos Forwarded/X-Forwarded-* enviados pelo cliente e gravar os valores reais.
server.forward-headers-strategy=native
