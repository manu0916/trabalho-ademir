# Local development only: use the in-memory database. Never use this profile in production.
spring.datasource.url=jdbc:h2:mem:hardware_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# Hero and product galleries accept only small, already-compressed JPEG/PNG/WebP uploads.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=18MB

# The H2 console must never be exposed by the application.
spring.h2.console.enabled=false

# Admin session settings. The prod profile enforces Secure cookies and HTTPS.
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=NEXUS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false

# Do not reveal internal implementation details in error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Admin credentials and the WhatsApp destination are deliberately profile-scoped.
# Use the local profile for development; prod/supabase require environment values.
# Optional in development. In production configure a private value with at least 32 bytes.
app.admin.access-token-secret=${APP_ADMIN_ACCESS_TOKEN_SECRET:}
app.security.enforce-https=false
app.security.api-rate-limit-per-minute=120
app.security.payment-status-rate-limit-per-minute=240
app.security.webhook-rate-limit-per-minute=600
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,https://trabalho-ademir-p1dqetak7-manu0916s-projects.vercel.app}

# Stripe-hosted Checkout. Secret values stay exclusively in the backend environment.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/pagamento/sucesso}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/pagamento/cancelado}
app.stripe.checkout-expires-minutes=${STRIPE_CHECKOUT_EXPIRES_MINUTES:30}
app.stripe.pix-expires-minutes=${STRIPE_PIX_EXPIRES_MINUTES:30}
app.stripe.boleto-expires-days=${STRIPE_BOLETO_EXPIRES_DAYS:1}
app.stripe.live-mode=${STRIPE_LIVE_MODE:false}
app.stripe.reconciliation-interval-ms=${STRIPE_RECONCILIATION_INTERVAL_MS:60000}
app.stripe.enabled-payment-methods=${STRIPE_PAYMENT_METHODS:CARTAO_CREDITO,BOLETO}

# WhatsApp payment flow. The destination is defined by the active profile.
# How many minutes a PENDING_PAYMENT WhatsApp order stays alive before it is automatically cancelled.
app.store.whatsapp-expiry-minutes=${APP_STORE_WHATSAPP_EXPIRY_MINUTES:60}
# How often the expiry cleanup job runs (milliseconds). Default: every 5 minutes.
app.store.whatsapp-expiry-check-interval-ms=${APP_STORE_WHATSAPP_EXPIRY_CHECK_INTERVAL_MS:300000}
