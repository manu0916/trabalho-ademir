# Local development only: use the in-memory database. Never use this profile in production.
spring.datasource.url=jdbc:h2:mem:hardware_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# The H2 console must never be exposed by the application.
spring.h2.console.enabled=false

# Admin session settings. The prod profile enforces Secure cookies and HTTPS.
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=NEXUS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false

# Do not reveal internal implementation details in error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

