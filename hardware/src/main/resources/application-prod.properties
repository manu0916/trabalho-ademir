# Enable this profile only behind HTTPS with a persistent database configured.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=__Host-NEXUS_SESSION
app.security.enforce-https=true

# Production intentionally has no database defaults.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
